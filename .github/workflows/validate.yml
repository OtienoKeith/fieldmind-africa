name: validate

on:
  push:
  pull_request:

jobs:
  cpu-safe-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/prepare_dataset.py --offline-seed-only
      - run: python scripts/validate_data.py
      - run: python scripts/train_qlora.py --smoke-config
      - run: python scripts/check_submission.py --allow-placeholders --allow-missing-model
      - run: pytest -q
